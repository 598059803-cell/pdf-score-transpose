[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-score-transpose"
version = "0.1.1"
description = "Local PDF OMR and spelling-aware MusicXML transposition, with a Codex Skill for native Sibelius delivery"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["Pillow>=10"]

[project.scripts]
scoretool = "scoretool:main"

[tool.setuptools]
py-modules = ["scoretool"]
package-dir = {"" = "scripts"}
